<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;height:100%;background:#15171b;color:#eee;font:13px system-ui}#planet-main{position:absolute;inset:0}#planet-main canvas{width:100%;height:100%;display:block}body{overflow:hidden}#planet-mini{display:none}#load{position:absolute;left:16px;top:12px;color:#999;font-size:12px}#resetform{position:absolute;right:12px;top:12px;width:32px;height:32px;border:1px solid #53585f;background:#25292ddd;color:#eee;border-radius:10px;font-size:18px;cursor:pointer}#resetform:active{background:#425a50}html.desktop,html.desktop body{background:transparent}html.desktop #resetform{display:none}canvas{touch-action:none;cursor:default}canvas:active{cursor:defaultbing}</style><script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script><div id="planet-main"></div><div id="planet-mini"></div><div id="celebration-note" hidden role="status" style="position:absolute;left:12px;right:12px;bottom:20px;text-align:center;pointer-events:none;opacity:0;color:#ffe7a9;font-size:16px;font-weight:650">今天全部完成 ✦</div><button id="resetform" aria-label="重置哥斯拉形态" title="回到最初的小哥斯拉，保留累计 XP">↺</button><span id="load">◌</span><script>
let state={xp:0,tasks:[]},eventID=null,celebrationID=null;window.planetState=()=>state;window.resetGrowth=()=>{state={...state,growthXP:0};window.webkit?.messageHandlers.resetform?.postMessage("reset");};window.nativeUpdate=s=>{state=s;if(s.event&&s.event.id!==eventID){const previous=eventID;eventID=s.event.id;if(previous!==null||Date.now()/1000-s.event.timestamp<8){dispatchEvent(new CustomEvent('planet-attack',{detail:{kind:'fire',id:s.event.taskID}}))}}if(s.celebration?.valid&&s.celebration.id!==celebrationID){const previous=celebrationID;celebrationID=s.celebration.id;if(previous!==null||Date.now()/1000-s.celebration.timestamp<8)dispatchEvent(new Event('planet-celebrate'));}dispatchEvent(new Event('planet-update'));};window.addEventListener('planet-ready',()=>{document.getElementById('load').remove();window.webkit?.messageHandlers.ready.postMessage('ready')});
</script><script type="module" src="planet.js"></script>
